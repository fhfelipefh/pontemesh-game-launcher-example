[package]
name = "pontemesh-game-launcher-ui"
version = "0.3.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/fhfelipefh/pontemesh-game-launcher-example"
default-run = "pontemesh-game-launcher-ui"

[dependencies]
pontemesh-sdk-core = { git = "https://github.com/fhfelipefh/pontemesh-sdk", rev = "0b28ee415d5934dade9c8a774578fa04d326662c", version = "0.2.0" }
fs2 = "0.4"
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "0.8"
eframe = "0.29"
tokio = { version = "1.0", features = ["rt", "macros", "sync"] }
