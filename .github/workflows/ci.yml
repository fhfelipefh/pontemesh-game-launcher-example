name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - run: cargo test --all-targets --locked --manifest-path examples/rust/Cargo.toml

  python:
    name: Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s examples/python -p "test_*.py"

  javascript:
    name: JavaScript (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/javascript/package-lock.json
      - run: npm ci
        working-directory: examples/javascript
      - run: npm test
        working-directory: examples/javascript

  cpp:
    name: C++ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fhfelipefh/pontemesh-sdk
          path: pontemesh-sdk
          persist-credentials: false
      - run: >-
          cmake -S examples/cpp -B examples/cpp/build
          -DPONTEMESH_SDK_INCLUDE_DIR=${{ github.workspace }}/pontemesh-sdk/bindings/c/include
      - run: cmake --build examples/cpp/build --config Release
      - run: ctest --test-dir examples/cpp/build -C Release --output-on-failure

  quality:
    name: Formatting and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all --manifest-path examples/rust/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path examples/rust/Cargo.toml -- -D warnings
      - run: python -m compileall -q examples/python

  end-to-end:
    name: All languages against a real Server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: fhfelipefh/pontemesh-sdk
          path: pontemesh-sdk
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.11"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/javascript/package-lock.json
      - name: Build the native SDK
        run: cargo build --release --manifest-path pontemesh-sdk/bindings/c/Cargo.toml
      - run: npm ci
        working-directory: examples/javascript
      - name: Build the C++ launcher
        run: >-
          cmake -S examples/cpp -B examples/cpp/build
          -DPONTEMESH_SDK_INCLUDE_DIR=${{ github.workspace }}/pontemesh-sdk/bindings/c/include
      - run: cmake --build examples/cpp/build --config Release
      - name: Start and bootstrap the Origin
        run: |
          docker compose up --build -d
          cargo run --locked --manifest-path examples/rust/Cargo.toml --bin bootstrap
      - name: Run every launcher
        env:
          PONTEMESH_SDK_LIBRARY: ${{ github.workspace }}/pontemesh-sdk/target/release/libpontemesh_sdk.so
        run: |
          cargo run --release --locked --manifest-path examples/rust/Cargo.toml
          python examples/python/launcher.py
          cd examples/javascript
          npm start
          cd ../..
          ./examples/cpp/build/pontemesh_game_launcher_cpp
      - name: Stop the demonstration environment
        if: always()
        run: docker compose down --volumes
